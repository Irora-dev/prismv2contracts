[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
# Deploy.s.sol reads merkle/out/canary.json to prove one real leaf against MERKLE_ROOT before
# broadcasting. Read-only, and scoped to that directory only.
fs_permissions = [{ access = "read", path = "./airdrop" }, { access = "read", path = "./merkle/out" }]
remappings = [
    "solady/=lib/solady/",
    "@uniswap/v4-core/=lib/v4-periphery/lib/v4-core/",
    "@uniswap/v4-periphery/=lib/v4-periphery/",
    "permit2/=lib/v4-periphery/lib/permit2/",
    "forge-std/=lib/forge-std/src/",
]

[invariant]
runs = 500
depth = 60
fail_on_revert = false
call_override = false
